services:
  - type: web
    name: houo-attend-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEMBER_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
